services:
  prode-api:
    build: ./backend
    container_name: prode-api
    environment:
      PORT: "8080"
      DB_PATH: /data/prode.db
    env_file:
      - ./backend/.env
    volumes:
      - db_data:/data
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prode-api.rule=Host(`prode-api.joaquinvasquez.com`)"
      - "traefik.http.routers.prode-api.entrypoints=websecure"
      - "traefik.http.routers.prode-api.tls.certresolver=cloudflare"
      - "traefik.http.services.prode-api.loadbalancer.server.port=8080"
      - "traefik.http.middlewares.prode-api-ratelimit.ratelimit.average=10"
      - "traefik.http.middlewares.prode-api-ratelimit.ratelimit.burst=20"
      - "traefik.http.middlewares.prode-api-cors.headers.accesscontrolalloworiginlist=https://prode-mundial-gules.vercel.app"
      - "traefik.http.middlewares.prode-api-cors.headers.accesscontrolallowmethods=GET,POST,PATCH,DELETE,OPTIONS"
      - "traefik.http.middlewares.prode-api-cors.headers.accesscontrolallowheaders=Content-Type"
      - "traefik.http.routers.prode-api.middlewares=prode-api-cors,prode-api-ratelimit"
    restart: unless-stopped

volumes:
  db_data:

networks:
  web:
    external: true