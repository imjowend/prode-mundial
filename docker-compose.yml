services:
  backend:
    build: ./backend
    container_name: prode-backend
    environment:
      PORT: "8080"
      ADMIN_CODE: ${ADMIN_CODE}
      DB_PATH: /data/prode.db
      ALLOWED_ORIGIN: "*"
    volumes:
      - db_data:/data
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prode.rule=Host(`prode-api.joaquinvasquez.com`)"
      - "traefik.http.routers.prode.entrypoints=websecure"
      - "traefik.http.routers.prode.tls.certresolver=cloudflare"
      - "traefik.http.services.prode.loadbalancer.server.port=8080"
    restart: unless-stopped

volumes:
  db_data:

networks:
  web:
    external: true
