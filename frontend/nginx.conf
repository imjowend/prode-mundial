server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxea las llamadas a la API al backend
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA: cualquier ruta que no sea un archivo sirve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
